spring.application.name=riesgos
server.port=X

# Conexión directa a SQL Server Express sin requerir DLLs locales
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=X;encrypt=true;trustServerCertificate=true;integratedSecurity=false;
# Credenciales por defecto de tu instancia local (o déjalas vacías si usas acceso libre)
spring.datasource.username=X
spring.datasource.password=X

# Configuración básica de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


