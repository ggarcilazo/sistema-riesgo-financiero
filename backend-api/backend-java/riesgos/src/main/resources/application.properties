spring.application.name=riesgos
# Cambiamos el puerto al 8081 para liberar el 8080 ocupado
server.port=8081

# Conexión directa a SQL Server Express sin requerir DLLs locales
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=BancoRiesgos;encrypt=true;trustServerCertificate=true;integratedSecurity=false;
# Credenciales por defecto de tu instancia local (o déjalas vacías si usas acceso libre)
spring.datasource.username=sa
spring.datasource.password=2604

# Configuración básica de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


